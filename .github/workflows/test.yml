name: Backend Tests

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: croppro_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d croppro_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      CROPPRO_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/croppro_test
      SECRET_KEY: test-secret-key-do-not-use-in-prod-48-chars-minimum-padding-padding
      AGENT_API_KEY: test-agent-key
      CROPPRO_LICENSE_ENFORCE: "0"
      ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run critical tenant safety suites
        run: |
          pytest tests/test_agent_ingestion.py tests/test_tenant_isolation.py tests/test_phishing.py tests/test_monitoring.py -q

      - name: Run tests with coverage
        run: |
          pytest --cov=app --cov=database --cov=main --cov-report=term-missing --cov-report=xml --cov-fail-under=60

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: backend/coverage.xml

      - name: Upload to Codecov
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
          token: ${{ env.CODECOV_TOKEN }}
          fail_ci_if_error: false

  frontend-sanity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Validate websocket callback declaration order
        run: npm run check:ws-order

      - name: Validate UI/UX guardrails
        run: npm run check:ui-ux-guards

      - name: Build frontend
        run: npm run build
