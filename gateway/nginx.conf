worker_processes auto;

events {
    worker_connections 2048;
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream cropsentinel_frontend {
        server frontend:80;
    }

    upstream cropsentinel_backend {
        server backend:8000;
    }

    upstream cropsentinel_agent_control {
        server agent-control:8000;
    }

    upstream cropsentinel_monitoring {
        server monitoring:8000;
    }

    upstream cropsentinel_realtime {
        server realtime:8000;
    }

    log_format cropsentinel '$remote_addr - $request_id [$time_local] "$request" '
                           '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                           'upstream=$upstream_addr request_time=$request_time upstream_time=$upstream_response_time';

    server {
        listen 80;
        server_name _;

        access_log /var/log/nginx/access.log cropsentinel;
        error_log /var/log/nginx/error.log warn;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Trace-ID $request_id;

        location = /api/machines/register {
            proxy_pass http://cropsentinel_agent_control;
            proxy_http_version 1.1;
        }

        location = /api/activity/heartbeat {
            proxy_pass http://cropsentinel_agent_control;
            proxy_http_version 1.1;
        }

        location = /api/activity/browser {
            proxy_pass http://cropsentinel_monitoring;
            proxy_http_version 1.1;
        }

        location = /api/activity/application {
            proxy_pass http://cropsentinel_monitoring;
            proxy_http_version 1.1;
        }

        location = /api/activity/screenshot {
            proxy_pass http://cropsentinel_monitoring;
            proxy_http_version 1.1;
        }

        location = /api/activity/input {
            proxy_pass http://cropsentinel_monitoring;
            proxy_http_version 1.1;
        }

        location = /api/activity/phishing {
            proxy_pass http://cropsentinel_monitoring;
            proxy_http_version 1.1;
        }

        location = /api/activity/batch {
            proxy_pass http://cropsentinel_monitoring;
            proxy_http_version 1.1;
        }

        location = /api/activity/file {
            proxy_pass http://cropsentinel_monitoring;
            proxy_http_version 1.1;
        }

        location = /api/activity/network {
            proxy_pass http://cropsentinel_monitoring;
            proxy_http_version 1.1;
        }

        location /api/sessions/ {
            proxy_pass http://cropsentinel_realtime;
            proxy_http_version 1.1;
        }

        location /api/ {
            proxy_pass http://cropsentinel_backend;
            proxy_http_version 1.1;
        }

        location /ws/ {
            proxy_pass http://cropsentinel_realtime;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /_internal/ {
            proxy_pass http://cropsentinel_backend;
            proxy_http_version 1.1;
        }

        location / {
            proxy_pass http://cropsentinel_frontend;
            proxy_http_version 1.1;
        }
    }
}
