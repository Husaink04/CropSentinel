[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Force non-production defaults before any app import touches these.
# pytest-env (from requirements-dev.txt) applies these before collection, so
# they reach module-level code in app.core, database, licensing, etc.
# The `D:` prefix means "only set if the caller hasn't already exported it".
env =
    D:CROPPRO_LICENSE_ENFORCE=0
    D:ENV=test
    D:AGENT_API_KEY=test-agent-key
    D:SECRET_KEY=test-secret-key-do-not-use-in-prod-48-chars-minimum-padding-padding

filterwarnings =
    ignore::DeprecationWarning:passlib.*
    ignore::DeprecationWarning:pydantic.*
    ignore:'asyncio\.iscoroutinefunction' is deprecated and slated for removal in Python 3\.16; use inspect\.iscoroutinefunction\(\) instead:DeprecationWarning:pytest_asyncio\.plugin
    ignore:'asyncio\.get_event_loop_policy' is deprecated and slated for removal in Python 3\.16:DeprecationWarning:pytest_asyncio\.plugin
    ignore:'asyncio\.set_event_loop_policy' is deprecated and slated for removal in Python 3\.16:DeprecationWarning:pytest_asyncio\.plugin
    ignore:'asyncio\.iscoroutinefunction' is deprecated and slated for removal in Python 3\.16; use inspect\.iscoroutinefunction\(\) instead:DeprecationWarning:slowapi\.extension

addopts =
    -ra
    --strict-config
    --strict-markers
    --tb=short

markers =
    slow: tests that take more than ~1s
    integration: requires a live Postgres test database
